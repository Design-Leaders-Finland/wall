name: wall
description: "Anonymous chat wall"
license: Apache-2.0
publish_to: "none"
version: 0.1.0

homepage: https://wall.designleaders.fi
repository: https://github.com/Design-Leaders-Finland/wall
issue_tracker: https://github.com/Design-Leaders-Finland/wall/issues

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.15.0 # Use the latest version
  intl: ^0.20.2 # For date formatting
  logging: ^1.3.0
  shared_preferences: ^2.5.5 # For local storage
  uuid: ^4.6.0 # For UUID generation
  string_validator: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/certificates/
