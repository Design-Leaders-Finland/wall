name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency: # new commits on the same branch/PR cancel the older, now-obsolete run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1" # single source of truth, reused by all jobs

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Code quality checks
  quality-checks:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter SDK # local composite action: avoids marketplace actions with unpinned nested steps
        # Install the pinned Flutter SDK used by the repo.
        uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}

      - name: Cache pub dependencies
        # Reuse pub cache to speed up dependency installs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          echo "Checking code formatting..."
          dart format --set-exit-if-changed .

      - name: Analyze code
        run: |
          echo "Running static analysis..."
          flutter analyze --fatal-infos

      - name: Generate API documentation
        run: |
          dart doc --output docs

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: docs/
          retention-days: 7

      - name: Deploy documentation to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true

      - name: Run unit tests
        run: |
          echo "Running unit tests..."
          flutter test --coverage

      - name: Upload coverage to Codacy
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh)
        continue-on-error: true
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@fd52dc852530a708d68c3b7342f8d33d1df4cd55 # v2.2.1
        continue-on-error: true
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/lcov.info

  # Build tests for different platforms
  build-tests:
    name: Build Tests
    needs: quality-checks
    strategy:
      matrix:
        platform: [web, android, windows, ios]
        include:
          - platform: web
            os: ubuntu-latest
            build-cmd: flutter build web --release
          - platform: android
            os: ubuntu-latest
            build-cmd: flutter build apk --release
          - platform: windows
            os: windows-latest
            build-cmd: flutter build windows --release
          - platform: ios
            os: macos-latest
            build-cmd: flutter build ios --release --no-codesign

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter SDK # local composite action: avoids marketplace actions with unpinned nested steps
        # Install the pinned Flutter SDK used by the repo.
        uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}

      - name: Cache pub dependencies
        # Reuse pub cache to speed up dependency installs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-

      - name: Setup Java (for Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Enable platform
        run: |
          if [ "${{ matrix.platform }}" = "web" ]; then
            flutter config --enable-web
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            flutter config --enable-windows-desktop
          elif [ "${{ matrix.platform }}" = "android" ]; then
            flutter config --enable-android
          elif [ "${{ matrix.platform }}" = "ios" ]; then
            flutter config --enable-ios
          fi
        shell: bash

      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.build-cmd }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.platform }}
          path: |
            build/web/
            build/app/outputs/flutter-apk/
            build/windows/x64/runner/Release/
            build/ios/iphoneos/
          retention-days: 7
        continue-on-error: true

  deploy-netlify:
    name: Deploy to Netlify
    needs: build-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download web build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-web
          path: build/

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0.0
        with:
          publish-dir: "./build/web"
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy to Netlify from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1
