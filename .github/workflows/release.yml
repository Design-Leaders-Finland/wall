name: Release tagged version

on:
  push:
    tags: ["v*"]

env:
  FLUTTER_VERSION: "3.47.2" # single source of truth, reused by all jobs

permissions:
  contents: write
  packages: write

jobs:
  check-ci-cd:
    name: Check CI/CD Pipeline Status
    runs-on: ubuntu-latest
    outputs:
      ci-passed: ${{ steps.check-status.outputs.ci-passed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CI/CD Pipeline Status
        id: check-status
        run: |
          # Get the commit SHA that the tag points to
          COMMIT_SHA=$(git rev-list -n 1 ${{ github.ref }})
          echo "Tag points to commit: $COMMIT_SHA"

          # Check if CI/CD workflow passed for this commit
          WORKFLOW_RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci-cd.yml/runs?head_sha=$COMMIT_SHA&status=completed")

          # Check if any run was successful
          SUCCESS_COUNT=$(echo "$WORKFLOW_RUNS" | jq '[.workflow_runs[] | select(.conclusion == "success")] | length')

          if [ "$SUCCESS_COUNT" -gt 0 ]; then
            echo "CI/CD pipeline passed for commit $COMMIT_SHA"
            echo "ci-passed=true" >> $GITHUB_OUTPUT
          else
            echo "CI/CD pipeline did not pass for commit $COMMIT_SHA"
            echo "ci-passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-build:
    name: Release Build & Deploy
    needs: check-ci-cd
    if: needs.check-ci-cd.outputs.ci-passed == 'true'
    strategy:
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "APP_VERSION=wall-v$VERSION" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev" >> $GITHUB_OUTPUT
            echo "APP_VERSION=wall-dev" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Setup Flutter SDK # local composite action: avoids marketplace actions with unpinned nested steps
        # Install the pinned Flutter SDK used by the repo.
        uses: design-leaders-finland/.github/actions/setup-flutter@b9dc79c591b43b0a6eac4d5dcb0c5e89be9af16b
        with:
          version: ${{ env.FLUTTER_VERSION }}

      - name: Cache pub dependencies
        # Reuse pub cache to speed up dependency installs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-

      - name: Setup Java for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release
          echo "Android APK build completed, checking output:"
          ls -la build/app/outputs/flutter-apk/ || echo "Android APK directory not found"
          # Rename APK with app name and version
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ steps.version.outputs.APP_VERSION }}.apk
          fi
        shell: bash

      - name: Build Android App Bundle
        if: matrix.platform == 'android'
        run: |
          flutter build appbundle --release
          echo "Android App Bundle build completed, checking output:"
          ls -la build/app/outputs/bundle/release/ || echo "Android AAB directory not found"
          # Rename AAB with app name and version
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/${{ steps.version.outputs.APP_VERSION }}.aab
          fi
        shell: bash

      - name: Build Web
        if: matrix.platform == 'android'
        run: |
          flutter config --enable-web
          flutter build web --release
          # Create a zip file for web build with app name and version
          cd build
          zip -r ${{ steps.version.outputs.APP_VERSION }}-web.zip web/
          cd ..
        shell: bash

      - name: Build iOS (without signing)
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign
          echo "iOS build completed, checking output:"
          ls -la build/ios/iphoneos/ || echo "iOS build directory not found"
          # Create a zip file for iOS build with app name and version
          cd build/ios
          zip -r ${{ steps.version.outputs.APP_VERSION }}-ios.zip iphoneos/
          cd ../..
        shell: bash

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
          $dest = "build\${{ steps.version.outputs.APP_VERSION }}-windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse "build\windows\x64\runner\Release\*" $dest
          Compress-Archive -Path $dest -DestinationPath "build\${{ steps.version.outputs.APP_VERSION }}-windows.zip" -Force
        shell: pwsh

      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/${{ steps.version.outputs.APP_VERSION }}.apk

      - name: Upload Android App Bundle
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/${{ steps.version.outputs.APP_VERSION }}.aab

      - name: Upload Web Build
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-build
          path: build/${{ steps.version.outputs.APP_VERSION }}-web.zip

      - name: Upload iOS Build
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build
          path: build/ios/${{ steps.version.outputs.APP_VERSION }}-ios.zip
        continue-on-error: true

      - name: Upload Windows Build
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: build/${{ steps.version.outputs.APP_VERSION }}-windows.zip
        continue-on-error: true

  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check-ci-cd, release-build]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk
          path: ./artifacts/
        continue-on-error: true

      - name: Download Android App Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-aab
          path: ./artifacts/
        continue-on-error: true

      - name: Download iOS Build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-build
          path: ./artifacts/
        continue-on-error: true

      - name: Download Windows Build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-build
          path: ./artifacts/
        continue-on-error: true

      - name: Download Web Build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build
          path: ./artifacts/
        continue-on-error: true

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -type f -name "*" 2>/dev/null || echo "No artifacts found"

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ./artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
